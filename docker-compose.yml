services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: test_platform
      POSTGRES_USER: test_platform
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      - postgres
    environment:
      DATABASE_URL: postgresql+psycopg2://test_platform:${POSTGRES_PASSWORD}@postgres:5432/test_platform
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRE_MINUTES: 720
      CORS_ORIGINS: https://test.ibos.uz,http://test.ibos.uz,https://test.2007.uz
    ports:
      - "127.0.0.1:8001:8000"

volumes:
  postgres_data:
